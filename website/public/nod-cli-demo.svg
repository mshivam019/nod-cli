<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Professional animated macOS terminal demo</title>
  <desc id="desc">An animated macOS Terminal-style session showing nod-cli scaffolding a generic TypeScript backend with AWS SAM, cron examples, and Postgres rate limiting.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0c0c"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>

    <filter id="window-shadow" x="0" y="0" width="1200" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <style>
    .command { animation: type-command 10s steps(79, end) infinite; }
    .cursor-track { animation: cursor-move 10s steps(79, end) infinite; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .r1 { animation: row 10s ease infinite; animation-delay: 1.15s; }
    .r2 { animation: row 10s ease infinite; animation-delay: 1.55s; }
    .r3 { animation: row 10s ease infinite; animation-delay: 1.95s; }
    .r4 { animation: row 10s ease infinite; animation-delay: 2.35s; }
    .r5 { animation: row 10s ease infinite; animation-delay: 2.8s; }
    .r6 { animation: row 10s ease infinite; animation-delay: 3.25s; }
    .r7 { animation: row 10s ease infinite; animation-delay: 3.7s; }
    .r8 { animation: row 10s ease infinite; animation-delay: 4.15s; }
    .r9 { animation: row 10s ease infinite; animation-delay: 4.6s; }
    .r10 { animation: row 10s ease infinite; animation-delay: 5.05s; }
    .r11 { animation: row 10s ease infinite; animation-delay: 5.5s; }
    .r12 { animation: row 10s ease infinite; animation-delay: 5.95s; }
    .r13 { animation: row 10s ease infinite; animation-delay: 6.45s; }
    .r14 { animation: row 10s ease infinite; animation-delay: 6.9s; }

    @keyframes type-command {
      0% { clip-path: inset(0 100% 0 0); }
      13%, 90% { clip-path: inset(0 0 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
    @keyframes cursor-move {
      0% { transform: translateX(-716px); }
      13%, 90% { transform: translateX(0); }
      100% { transform: translateX(-716px); }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes row {
      0%, 14% { opacity: 0; transform: translateY(6px); }
      24%, 91% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes scroll {
      0%, 55% { transform: translateY(0); opacity: 0.2; }
      80%, 91% { transform: translateY(235px); opacity: 0.5; }
      100% { transform: translateY(0); opacity: 0.2; }
    }
  </style>

  <rect width="1200" height="700" fill="url(#desktop)"/>

  <g filter="url(#window-shadow)">
    <rect x="78" y="54" width="1044" height="592" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="0.5"/>

    <path d="M78 66 C78 59.373 83.373 54 90 54 H1110 C1116.63 54 1122 59.373 1122 66 V92 H78 V66 Z" fill="#2D2D2D"/>
    <line x1="78" y1="92" x2="1122" y2="92" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>

    <circle cx="98" cy="73" r="6" fill="#FF5F56"/>
    <circle cx="118" cy="73" r="6" fill="#FFBD2E"/>
    <circle cx="138" cy="73" r="6" fill="#27C93F"/>

    <text x="600" y="77" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">nod-cli</text>


    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14">
      
      <text x="104" y="146" fill="#4ADE80">dev@macbook</text>
      <text x="196" y="146" fill="#9CA3AF">:</text>
      <text x="206" y="146" fill="#A78BFA">~/work</text>
      <text x="256" y="146" fill="#9CA3AF">%</text>

      <g class="command">
        <text x="276" y="146" textLength="710" lengthAdjust="spacingAndGlyphs" fill="#F3F4F6">nod backend demo-api --preset aws-sam-backend --rate-limit-store postgres --yes</text>
      </g>
      <g class="cursor-track">
        <rect class="cursor" x="992" y="132" width="7" height="18" rx="1" fill="#F3F4F6"/>
      </g>

      <g class="r1" opacity="0">
        <text x="104" y="186" fill="#34D399">◆</text>
        <text x="130" y="186" fill="#E5E7EB" font-weight="600">nod-cli</text>
      </g>

      <g class="r2" opacity="0">
        <text x="104" y="216" fill="#4B5563">│</text>
        <text x="130" y="216" fill="#9CA3AF">Project</text>
        <text x="250" y="216" fill="#F3F4F6">demo-api</text>
      </g>
      <g class="r3" opacity="0">
        <text x="104" y="246" fill="#4B5563">│</text>
        <text x="130" y="246" fill="#9CA3AF">Preset</text>
        <text x="250" y="246" fill="#F3F4F6">aws-sam-backend</text>
      </g>
      <g class="r4" opacity="0">
        <text x="104" y="276" fill="#4B5563">│</text>
        <text x="130" y="276" fill="#9CA3AF">Stack</text>
        <text x="250" y="276" fill="#F3F4F6">Express, TypeScript, Node 22</text>
      </g>
      <g class="r5" opacity="0">
        <text x="104" y="306" fill="#4B5563">│</text>
        <text x="130" y="306" fill="#9CA3AF">Deploy</text>
        <text x="250" y="306" fill="#F3F4F6">AWS SAM + Vercel build config</text>
      </g>
      <g class="r6" opacity="0">
        <text x="104" y="336" fill="#4B5563">│</text>
        <text x="130" y="336" fill="#9CA3AF">Rate limit</text>
        <text x="250" y="336" fill="#F3F4F6">Postgres</text>
      </g>

      <g class="r7" opacity="0">
        <text x="104" y="376" fill="#10B981">✓</text>
        <text x="130" y="376" fill="#D1D5DB">Wrote package.json, tsconfig.json, tsconfig.build.json</text>
      </g>
      <g class="r8" opacity="0">
        <text x="104" y="406" fill="#10B981">✓</text>
        <text x="130" y="406" fill="#D1D5DB">Wrote src/app.ts, src/lambda.ts, src/cron-lambda.ts</text>
      </g>
      <g class="r9" opacity="0">
        <text x="104" y="436" fill="#10B981">✓</text>
        <text x="130" y="436" fill="#D1D5DB">Wrote scripts/build-lambda.mjs and runtime import checks</text>
      </g>
      <g class="r10" opacity="0">
        <text x="104" y="466" fill="#10B981">✓</text>
        <text x="130" y="466" fill="#D1D5DB">Wrote template.yaml, vercel.json, and drizzle schema</text>
      </g>
      <g class="r11" opacity="0">
        <text x="104" y="496" fill="#10B981">✓</text>
        <text x="130" y="496" fill="#D1D5DB">Added node, Vercel, pg_cron, and Lambda cron examples</text>
      </g>

      <g class="r12" opacity="0">
        <text x="104" y="536" fill="#A78BFA" font-weight="600">Done</text>
        <text x="154" y="536" fill="#F3F4F6">cd demo-api &amp;&amp; pnpm install</text>
      </g>

    </g>
  </g>
</svg>
